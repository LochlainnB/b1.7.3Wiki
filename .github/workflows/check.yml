# Build the wiki on every pull request, so an error shows on the pull request
# instead of failing the deploy after it is merged. Publishes nothing.
name: Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run still checking the old one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same build the deploy runs, so it fails on the same errors. The
      # cross-check against the decompiled source is left out: the source is
      # never in the repository, so there is nothing here to check against.
      - run: npm run build
